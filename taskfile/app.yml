version: "3"

tasks:
  auth:bootstrap:
    desc: initialize root/admin tokens through gated root control (requires pg-rootctl)
    cmds:
      - ./script/bootstrap-auth.sh

  scheduler:
    desc: run scheduler on host
    cmds:
      - go run cmd/scheduler/main.go

  discovery:
    desc: run discovery worker on host
    cmds:
      - go run ./cmd/worker/discovery/candidate

  pipeline:
    desc: run pipeline worker on host
    cmds:
      - go run cmd/pipeline-worker/main.go

  sources:bootstrap:
    desc: synchronize the source registry through the API
    cmds:
      - ./script/bootstrap-sources.sh

  nats:bootstrap:
    desc: create or update JetStream resources through the API
    cmds:
      - ./script/bootstrap-jetstream.sh
