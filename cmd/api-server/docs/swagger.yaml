    type: object
  api.AdminTask:
    properties:
      batch_id:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      failure_message:
        type: string
      frequency:
        type: integer
      id:
        type: string
      kind:
        type: string
      last_run_at:
