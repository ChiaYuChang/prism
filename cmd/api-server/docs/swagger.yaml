  api.AdminListBatchesResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminBatch'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListEntitiesResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminEntity'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListModelsResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminModel'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListPromptVersionsResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminPromptVersion'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListSchedulesResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminSchedule'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListSourcesResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminSource'
        type: array
      limit:
        type: integer
      next:
        type: integer
    type: object
  api.AdminListTasksResponse:
    properties:
      batch_id:
        type: string
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/api.AdminTask'
