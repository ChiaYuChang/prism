      candidate_id:
        type: string
      content:
        type: string
      fetched_at:
        type: string
      id:
        type: string
      published_at:
        type: string
      source_abbr:
        type: string
      title:
        type: string
      trace_id:
        type: string
      type:
        type: string
      url:
