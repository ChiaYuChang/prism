      payload_hash:
        type: string
      retry_count:
        type: integer
      source_abbr:
        type: string
      source_type:
        type: string
      status:
        $ref: '#/definitions/repo.TaskStatus'
      trace_id:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  api.AdminTaskStatusSummary:
    properties:
      count:
        type: integer
      kind:
        type: string
      status:
        $ref: '#/definitions/repo.TaskStatus'
    type: object
  api.AdminToken:
    properties:
      created_at:
