server {
    listen 8080;
    server_name _;

    client_max_body_size 2m;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/v1/admin/ {
        proxy_pass http://prism-api:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-PRISM-TOKEN $http_x_prism_token;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/ {
        proxy_pass http://prism-api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-PRISM-TOKEN $http_x_prism_token;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
