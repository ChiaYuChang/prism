port: 8090
admin:
  enabled: true
  port: 8091
read-timeout: 10s
write-timeout: 30s
shutdown-timeout: 10s
cors-origins: []
postgres:
  host: '{{ env "POSTGRES_HOST" "postgres" }}'
  port: {{ env "POSTGRES_PORT" "5432" }}
  username: '{{ env "POSTGRES_APP_USER" "prism" }}'
  db: '{{ env "POSTGRES_APP_DB" "prism" }}'
  sslmode: disable
  metrics-enabled: true
valkey:
  host: '{{ env "VALKEY_HOST" "valkey" }}'
  port: {{ env "VALKEY_PORT" "6379" }}
  username: '{{ env "VALKEY_APP_USER" "prism" }}'
  db: 0
  client-name: api-shared
  tracing-enabled: true
  metrics-enabled: true
nats:
  nats-host: '{{ env "PRISM_API_NATS_HOST" "nats" }}'
  nats-port: {{ env "PRISM_API_NATS_PORT" "4222" }}
  nats-token: '{{ env "PRISM_API_NATS_TOKEN" "" }}'
cache:
  enabled: {{ env "PRISM_WORKER_OTEL_ENABLED" "true" }}
  live-ttl: 2s
  terminal-ttl: 60s
scheduler-control:
  enabled: true
rate-limit:
  enabled: true
  rps: 100
  burst: 200
  ip-cache-size: 4096
auth:
  hash-algorithm: sha256
  token-types:
    admin:
      default-ttl: 720h
      max-ttl: 2160h
    user:
      default-ttl: 24h
      max-ttl: 168h
prompts:
  storage-uri: '{{ env "PRISM_PROMPT_STORAGE_URI" "file:///app/runtime/prompts" }}'
reports:
  storage-uri: '{{ env "PRISM_REPORT_STORAGE_URI" "file:///app/runtime/reports" }}'
web:
  enabled: true
  static-dir: /app/assets/static/prismctl-web
s3:
  endpoint: '{{ env "PRISM_API_S3_ENDPOINT" "" }}'
  region: '{{ env "PRISM_API_S3_REGION" "us-east-1" }}'
  access-key: '{{ env "PRISM_API_S3_ACCESS_KEY" "" }}'
  secret-key-file: '{{ env "PRISM_API_S3_SECRET_KEY_FILE" "" }}'
  use-path-style: {{ env "PRISM_API_S3_USE_PATH_STYLE" "true" }}
telemetry:
  enabled: true
  service-name: prism.api
  environment: local
  endpoint: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
  insecure: true
  sample-ratio: 1
  timeout: 10s
logger:
  level: info
  console:
    enable: true
  file:
    enable: true
    file: /logs/app.log
    max-size: 10MiB
    max-files: 5
  otel:
    url: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
    insecure: true
    timeout: 10s

monitoring:
  backend: valkey
  mode: pull
  interval: 10s
  timeout: 2s
  status-key: api:status
  internal-port: 8089
  targets:
    batch-detector:
      enabled: true
      url: http://batch-detector:8083/healthz
      description: Detects completed batches of party press releases
      group: batch.detector
    batch-publisher:
      enabled: true
      url: http://batch-publisher:8084/healthz
      description: Publishes batch completed events
      group: batch.publisher
    scheduler-slow:
      enabled: true
      url: http://scheduler-slow:8090/healthz
      description: Schedules and dispatches low-priority tasks
      group: scheduler.slow
    scheduler-fast:
      enabled: true
      url: http://scheduler-fast:8091/healthz
      description: Schedules and dispatches high-priority tasks
      group: scheduler.fast
    discovery:
      enabled: true
      url: http://discovery:8092/healthz
      description: Crawls and discovers candidate briefs
      group: discovery.candidate
    collector:
      enabled: true
      url: http://collector:8093/healthz
      description: Fetches and parses full press releases
      group: collector.worker
    planner:
      enabled: true
      url: http://planner:8094/healthz
      description: Plans and schedules media tasks
      group: discovery.planner
