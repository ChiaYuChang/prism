health-port: 8095
shutdown-timeout: 30s
archive: s3://prism-archives/canonical
messenger-type: nats
nats-host: nats
nats-port: 4222
queue-group: archive-worker
subscribers-count: 1
ack-wait-timeout: 30s
s3:
  endpoint: http://seaweedfs:8333
  region: '{{ env "SEAWEEDFS_S3_REGION" "us-east-1" }}'
  access-key: '{{ env "PRISM_ARCHIVE_WORKER_S3_ACCESS_KEY" "" }}'
  secret-key: '{{ env "PRISM_ARCHIVE_WORKER_S3_SECRET_KEY" "" }}'
  use-path-style: true
telemetry:
  enabled: {{ env "PRISM_WORKER_OTEL_ENABLED" "true" }}
  service-name: prism.archive
  environment: local
  endpoint: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
  insecure: true
  sample-ratio: 1
  timeout: 10s
logger:
  level: info
  console:
    enable: true
  file:
    enable: true
    file: /logs/app.log
    max-size: 10MiB
    max-files: 5
