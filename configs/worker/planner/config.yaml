health-port: 8094
shutdown-timeout: 30s
prompt-path: /app/assets/worker/planner/prompts/analysis/extractor.md
# Optional DB-registered prompt pin. When id is set, worker loads prompt by id,
# verifies key/version/hash, then reads the API-managed file from shared volume.
# prompt:
#   id: 00000000-0000-0000-0000-000000000000
#   key: worker/planner/analysis/extractor
#   version: 1
#   hash: sha256:...
messenger-type: nats
nats-host: nats
nats-port: 4222
queue-group: planner-worker
subscribers-count: 1
ack-wait-timeout: 30s
postgres:
  host: '{{ env "POSTGRES_HOST" "postgres" }}'
  port: {{ env "POSTGRES_PORT" "5432" }}
  username: '{{ env "POSTGRES_APP_USER" "prism" }}'
  db: '{{ env "POSTGRES_APP_DB" "prism" }}'
  sslmode: disable
  metrics-enabled: true
llm:
  provider:
    ollama:
      base_url: '{{ env "PRISM_PLANNER_OLLAMA_BASE_URL" "http://host.docker.internal:11434" }}'
  model: '{{ env "PRISM_PLANNER_LLM_MODEL" "glm-5.2:cloud" }}'
  timeout: 2m
search:
  targets:
    yahoo:
      enable: {{ env "PRISM_PLANNER_SEARCH_TARGET_YAHOO_ENABLE" "true" }}
      source_abbr: yahoo
      url: https://tw.news.yahoo.com
      site: tw.news.yahoo.com
telemetry:
  enabled: {{ env "PRISM_WORKER_OTEL_ENABLED" "true" }}
  service-name: prism.planner
  environment: local
  endpoint: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
  insecure: true
  sample-ratio: 1
  timeout: 10s
logger:
  level: info
  console:
    enable: true
  file:
    enable: true
    file: /logs/app.log
    max-size: 10MiB
    max-files: 5
  otel:
    url: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
    insecure: true
    timeout: 10s
