health-port: 8093
shutdown-timeout: 2m
http-timeout: 30s
max-processing-time: 2m
retry-max: 3
archive: s3://prism-archives/errors
s3:
  endpoint: http://seaweedfs:8333
  region: '{{ env "SEAWEEDFS_S3_REGION" "us-east-1" }}'
  access-key: '{{ env "PRISM_COLLECTOR_WORKER_S3_ACCESS_KEY" "" }}'
  secret-key-file: '{{ env "PRISM_COLLECTOR_WORKER_S3_SECRET_KEY_FILE" "" }}'
  use-path-style: true
parsers-config: /app/configs/worker/collector/parsers.yaml
prompt-storage: '{{ env "PRISM_PROMPT_STORAGE_URI" "file:///app/runtime/prompts" }}'
fixture-base: '{{ env "FIXTURE_BASE" "" }}'
force-minify-error: false
messenger-type: nats
nats-host: nats
nats-port: 4222
queue-group: collector-worker
subscribers-count: 1
ack-wait-timeout: 30s
nats-stream: prism_task
nats-consumer: collector-worker
nats-auto-provision: false
postgres:
  host: '{{ env "POSTGRES_HOST" "postgres" }}'
  port: {{ env "POSTGRES_PORT" "5432" }}
  username: '{{ env "POSTGRES_APP_USER" "prism" }}'
  db: '{{ env "POSTGRES_APP_DB" "prism" }}'
  sslmode: disable
  metrics-enabled: true
telemetry:
  enabled: {{ env "PRISM_WORKER_OTEL_ENABLED" "true" }}
  service-name: prism.collector
  environment: local
  endpoint: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
  insecure: true
  sample-ratio: 1
  timeout: 10s
logger:
  level: info
  console:
    enable: true
  file:
    enable: true
    file: /logs/app.log
    max-size: 10MiB
    max-files: 5
  otel:
    url: '{{ env "OTEL_COLLECTOR_ENDPOINT" "otel-collector:4317" }}'
    insecure: true
    timeout: 10s
