# App stack — long-running Prism app/trigger services gated behind the `app`
# profile so infra-only and worker-only starts remain possible. Activate with
# `task compose:app` or `docker compose --profile app up`.

services:
  cron-trigger:
    profiles: [ app ]
    image: prism/cron-trigger:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        TARGET: trigger/cron
        RUNTIME_IMAGE: ${WORKER_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - --config=/app/configs/trigger/cron/config.yaml
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-prism}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-prism}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
      PRISM_WORKER_OTEL_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
      PRISM_CRON_TRIGGER_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PRISM_CRON_TRIGGER_POSTGRES_USERNAME: ${POSTGRES_APP_USER:-prism}
      PRISM_CRON_TRIGGER_POSTGRES_DB: ${POSTGRES_APP_DB:-prism}
      PRISM_CRON_TRIGGER_TELEMETRY_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
    networks:
      - prism-net
    volumes:
      - ../runtime/logs/cron-trigger:/logs
    healthcheck:
      test: [ "CMD", "/app/healthcheck", "--url", "http://127.0.0.1:8085/readyz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  batch-detector:
    profiles: [ app ]
    image: prism/batch-detector:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        TARGET: batch/detector
        RUNTIME_IMAGE: ${WORKER_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - --config=/app/configs/batch/detector/config.yaml
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-prism}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-prism}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
      PRISM_WORKER_OTEL_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
      PRISM_BATCH_INTERVAL: ${PRISM_BATCH_INTERVAL:-1m}
      PRISM_BATCH_DETECTOR_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PRISM_BATCH_DETECTOR_POSTGRES_USERNAME: ${POSTGRES_APP_USER:-prism}
      PRISM_BATCH_DETECTOR_POSTGRES_DB: ${POSTGRES_APP_DB:-prism}
      PRISM_BATCH_DETECTOR_INTERVAL: ${PRISM_BATCH_INTERVAL:-1m}
      PRISM_BATCH_DETECTOR_TELEMETRY_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
    networks:
      - prism-net
    volumes:
      - ../runtime/logs/batch-detector:/logs
    healthcheck:
      test: [ "CMD", "/app/healthcheck", "--url", "http://127.0.0.1:8083/readyz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  batch-publisher:
    profiles: [ app ]
    image: prism/batch-publisher:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        TARGET: batch/publisher
        RUNTIME_IMAGE: ${WORKER_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - --config=/app/configs/batch/publisher/config.yaml
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-prism}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-prism}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
      PRISM_WORKER_OTEL_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
      PRISM_BATCH_INTERVAL: ${PRISM_BATCH_INTERVAL:-1m}
      PRISM_BATCH_PUBLISHER_NATS_TOKEN: ${NATS_AUTH_TOKEN}
      PRISM_BATCH_PUBLISHER_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PRISM_BATCH_PUBLISHER_POSTGRES_USERNAME: ${POSTGRES_APP_USER:-prism}
      PRISM_BATCH_PUBLISHER_POSTGRES_DB: ${POSTGRES_APP_DB:-prism}
      PRISM_BATCH_PUBLISHER_INTERVAL: ${PRISM_BATCH_INTERVAL:-1m}
      PRISM_BATCH_PUBLISHER_TELEMETRY_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
    networks:
      - prism-net
    volumes:
      - ../runtime/logs/batch-publisher:/logs
    healthcheck:
      test: [ "CMD", "/app/healthcheck", "--url", "http://127.0.0.1:8084/readyz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # api-server — user-facing HTTP API (Phase 2.7). Stage 3 toggles
  # (--cache-enabled, --rate-limit-enabled) are ON here so the live paths are
  # exercised by the Phase 6 e2e driver. Burst is high enough that a 1Hz poll
  # never trips the limiter.
  prism-api:
    profiles: [ app ]
    image: prism/api-server:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile.worker
      args:
        TARGET: api-server
        RUNTIME_IMAGE: ${WORKER_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}
    command:
      - --config=/app/configs/api-server/config.yaml
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-prism}
      POSTGRES_APP_DB: ${POSTGRES_APP_DB:-prism}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_APP_USER: ${VALKEY_APP_USER:-prism}
      PRISM_API_NATS_HOST: nats
      PRISM_API_NATS_PORT: 4222
      PRISM_API_NATS_TOKEN: ${NATS_AUTH_TOKEN}
      OTEL_COLLECTOR_ENDPOINT: otel-collector:4317
      PRISM_WORKER_OTEL_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
      PRISM_API_POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      PRISM_API_POSTGRES_USERNAME: ${POSTGRES_APP_USER:-prism}
      PRISM_API_POSTGRES_DB: ${POSTGRES_APP_DB:-prism}
      PRISM_API_VALKEY_PASSWORD: ${VALKEY_APP_PASSWORD}
      PRISM_API_VALKEY_USERNAME: ${VALKEY_APP_USER:-prism}
      PRISM_API_TELEMETRY_ENABLED: ${PRISM_WORKER_OTEL_ENABLED:-true}
      PRISM_API_ADMIN_PORT: 8091
    networks:
      - prism-net
      - prism-admin-net
      - prism-user-edge
    volumes:
      - ../runtime/logs/api-server:/logs
      - ../runtime/prompts:/app/runtime/prompts
    healthcheck:
      test: [ "CMD", "/app/healthcheck", "--url", "http://127.0.0.1:8091/readyz" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
