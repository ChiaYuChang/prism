services:
  prismctl-web-dev:
    profiles: [ web-dev ]
    image: prism/prismctl-web-dev:latest
    build:
      context: ../web/prismctl-web
      dockerfile: Dockerfile
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]
    networks:
      - prism-admin-net
    volumes:
      - ../web/prismctl-web:/app
      - prismctl_web_node_modules:/app/node_modules

volumes:
  prismctl_web_node_modules:
